# StormSense CREST (Chart Review and Evaluation Statistics Tool): one self-contained review page per
# station scoring every archived forecast, a map page, and CSV/GeoJSON feeds for ArcGIS. Code: crest/.
#
# Each run rebuilds the rolling 30-day and 7-day views and the month so far, and in a new month's first
# days also the month just ended, until its last forecasts are verified (3.5 days after it ended). Then
# the finished month's data is saved once as crest_month_YYYY-MM.tar.gz on release "crest-data", so later
# runs list every month without recomputing it; the first run (no crest-data yet) builds every month
# since the archive began. Pages and feeds go to release
# "crest-pages" (crest_site.zip) and, once the repository variable CREST_PAGES is "true" (after the
# repo is public and Pages uses GitHub Actions), to GitHub Pages at
# https://derekloftis.github.io/StormSense-archive/crest/.
# ArcGIS: with the secrets ARCGIS_URL and ARCGIS_API_KEY (or ARCGIS_USERNAME and ARCGIS_PASSWORD) the
# feeds are loaded into hosted feature layers (crest/arcgis_push.py), and the web map and the ArcGIS
# dashboard on them are created if they are not there (crest/arcgis_dashboard.py). They are then left
# alone so edits made in ArcGIS are kept; run with "dashboard" ticked to write them again from the code.
#
# Scheduling: dispatch from cron-job.org at 13:40 UTC daily (after the 12Z run has verified 0-12 h);
# the GitHub cron below is a late fallback, and a second run the same day just rebuilds.
# A pull request builds five stations and keeps the site as an artifact for review.
name: CREST review pages

on:
  schedule:
    - cron: "40 14 * * *"
  workflow_dispatch:
    inputs:
      periods:
        description: "Periods to build (e.g. 30d,7d,month or months for every month); empty = automatic"
        required: false
        default: ""
      dashboard:
        description: "Write the ArcGIS web map and dashboard again from the code (replaces edits made in ArcGIS)"
        type: boolean
        required: false
        default: false
  pull_request:
    paths: [crest/**, .github/workflows/crest.yml]

permissions:
  contents: write

concurrency:
  group: crest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event_name == 'pull_request' }}
    outputs:
      pages: ${{ steps.build.outcome == 'success' && github.event_name != 'pull_request' && vars.CREST_PAGES == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q numpy pandas

      - name: Reduced runs and observations from earlier builds
        uses: actions/cache@v4
        with:
          path: |
            work/runs
            work/obs
          key: crest-work-${{ github.run_id }}
          restore-keys: crest-work-

      - name: Months built earlier
        id: months
        run: |
          mkdir -p months
          if [ "$PR" != true ]; then
            gh release download crest-data -R "$GITHUB_REPOSITORY" -p 'crest_month_*.tar.gz' -D months 2>/dev/null || true
          fi
          for f in months/*.tar.gz; do [ -e "$f" ] && tar -xzf "$f" -C months && rm "$f"; done
          ls months
          echo "have=$(ls months | sed -n 's/^crest_month_//p' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        env:
          WANT: ${{ github.event.inputs.periods }}
          HAVE: ${{ steps.months.outputs.have }}
        run: |
          set -o pipefail
          ARGS=""
          if [ "$PR" = true ]; then
            P="30d,7d,month"; ARGS="--stations SWPT,YRCG,BISH,USJT,CNRC"
          elif [ -n "$WANT" ]; then
            P="$WANT"
          elif [ -z "$HAVE" ]; then
            P="30d,7d,months"            # first run: every month since the archive began
          else
            P="30d,7d,month"
            PREV=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
            case " $HAVE " in *" $PREV "*) ;; *) P="$P,$PREV" ;; esac   # last month, until it is saved
          fi
          echo "periods: $P"
          python -m crest.build --out site/crest --work work --periods "$P" --months-from months --bundle bundle $ARGS 2>&1 | tee crest_log.txt

      - name: Keep the work cache small
        if: always()
        run: |
          rm -rf work/tars
          find work/runs -name '*.json.gz' -mtime +45 -delete 2>/dev/null || true
          find work/obs -mindepth 1 -maxdepth 1 -type d -mtime +45 -exec rm -rf {} + 2>/dev/null || true
          du -sh work 2>/dev/null || true

      - name: Site root
        if: steps.build.outcome == 'success'
        run: |
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=crest/"><title>StormSense CREST</title><a href="crest/">StormSense CREST</a>\n' > site/index.html
          touch site/.nojekyll
          cp crest_log.txt site/crest/build_log.txt

      - name: Keep the site (pull requests and every run)
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: crest-site
          path: site
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 3 }}

      - name: Save finished months and the pages to releases
        if: steps.build.outcome == 'success' && github.event_name != 'pull_request'
        run: |
          gh release view crest-data -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create crest-data -R "$GITHUB_REPOSITORY" --title "CREST month data" \
              --notes "StormSense CREST data for each finished month (station and network JSON), one crest_month_YYYY-MM.tar.gz per month. Each CREST run downloads these so its pages list every month."
          for d in bundle/crest_month_*; do
            [ -d "$d" ] || continue
            tar -czf "$d.tar.gz" -C bundle "$(basename "$d")"
            gh release upload crest-data -R "$GITHUB_REPOSITORY" --clobber "$d.tar.gz"
          done
          (cd site && zip -qr ../crest_site.zip .)
          gh release view crest-pages -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create crest-pages -R "$GITHUB_REPOSITORY" --title "CREST pages" \
              --notes "The newest StormSense CREST site (map page, one page per station, data and feeds) as crest_site.zip, replaced on every run."
          gh release upload crest-pages -R "$GITHUB_REPOSITORY" --clobber crest_site.zip

      - name: Pages artifact
        if: steps.build.outcome == 'success' && github.event_name != 'pull_request' && vars.CREST_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # The Pages deploy starts when this job ends, so this step has a limit: a layer ArcGIS has not finished
      # in time is reported and left to finish there, and the pages go out.
      - name: Load the feeds into ArcGIS Online
        if: steps.build.outcome == 'success' && github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 45
        env:
          PYTHONUNBUFFERED: "1"   # each line as it happens, so the log times every layer
          ARCGIS_URL: ${{ secrets.ARCGIS_URL }}
          ARCGIS_API_KEY: ${{ secrets.ARCGIS_API_KEY }}
          ARCGIS_USERNAME: ${{ secrets.ARCGIS_USERNAME }}
          ARCGIS_PASSWORD: ${{ secrets.ARCGIS_PASSWORD }}
          CREST_DASHBOARD: ${{ github.event.inputs.dashboard == 'true' && 'rebuild' || '' }}
        run: |
          if [ -z "$ARCGIS_URL" ]; then echo "ArcGIS secrets not set; skipped"; exit 0; fi
          pip install -q requests
          python -m crest.arcgis_push site/crest/feeds

      - name: Show the end of a failed build as an annotation
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error title=CREST build failed::$(tail -c 900 crest_log.txt | tr '\n' ' ')"

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # GitHub sometimes can't see the Pages artifact for a short while after it is uploaded
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
